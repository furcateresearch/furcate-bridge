[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "furcate-bridge"
version = "1.0.0"
description = "Protocol adapters for Furcate distributed ML on edge devices"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Furcate", email = "dev@furcate.io"}
]
keywords = ["edge-computing", "federated-learning", "iot", "industrial-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "paho-mqtt>=2.0.0",
    "pymodbus>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
]

[project.urls]
Homepage = "https://furcate.io"
Documentation = "https://docs.furcate.io"
Repository = "https://github.com/furcateresearch/furcate-bridge"
